<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Benim Oynatıcım</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 250px;
      padding: 15px;
      background-color: #1a1a24;
      color: #fff;
      margin: 0;
      text-align: center;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #e91e63;
    }
    p {
      font-size: 13px;
      color: #ccc;
    }
    button {
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background-color: #d81557;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #f44336;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Videoyu Yakala</h3>
  <p>Sayfadaki videoyu tespit edip özel oynatıcıda açmak için butona tıklayın.</p>
  <button id="findVideoBtn">Oynatıcımla Aç</button>
  <div id="status">Video bulunamadı.</div>
  
  <script src="popup.js"></script>
</body>
</html>
