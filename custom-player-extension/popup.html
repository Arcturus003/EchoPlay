<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 250px;
            padding: 15px;
            text-align: center;
            background-color: #222;
            color: white;
            margin: 0;
        }
        h2 {
            margin-top: 0;
            color: #ff0055;
            font-size: 18px;
        }
        p {
            font-size: 13px;
            color: #ccc;
        }
        .status {
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #ff0055;
        }
    </style>
</head>
<body>
    <h2>Oynatıcı Eklentisi</h2>
    <p>Bu eklenti, bulunduğunuz sayfadaki videoları tespit edip sizin özel oynatıcınız ile değiştirir.</p>
    <div class="status">
        Durum: <strong>Aktif</strong>
    </div>
</body>
</html>
